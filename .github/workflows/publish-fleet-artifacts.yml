name: Publish fleet artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fleet-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Versioned skills bundle
    runs-on: [self-hosted, Linux, X64, fleet-release]
    timeout-minutes: 10
    steps:
      - name: Verify release runner capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Archive and describe tracked source
        run: |
          RELEASE_TAG="fleet-$GITHUB_SHA"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix=rjw-skills/ \
            --output=dist/rjw-skills.tar.gz \
            "$GITHUB_SHA"
          scripts/write-artifact-metadata.sh \
            dist/rjw-skills.tar.gz \
            dist/rjw-skills.tar.gz.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            any "" false

      - name: Transfer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-skills-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: bundle
    runs-on: [self-hosted, Linux, X64, fleet-release]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Collect release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fleet-skills-${{ github.sha }}
          path: dist

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-github-release.sh dist/*
