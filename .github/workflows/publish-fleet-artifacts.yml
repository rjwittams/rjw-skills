name: Publish fleet artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fleet-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Versioned skills bundle
    runs-on: [self-hosted, Linux, X64, fleet-release]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify release runner capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Check out exact source revision
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git init .
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "$SOURCE_URL"
          else
            git remote add origin "$SOURCE_URL"
          fi
          git fetch --force --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clean -ffdx

      - name: Archive and describe tracked source
        run: |
          RELEASE_TAG="fleet-$GITHUB_SHA"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix=rjw-skills/ \
            --output=dist/rjw-skills.tar.gz \
            "$GITHUB_SHA"
          scripts/write-artifact-metadata.sh \
            dist/rjw-skills.tar.gz \
            dist/rjw-skills.tar.gz.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            any "" false

      # Publishing adapter: a Forgejo fork replaces only this step.
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-github-release.sh \
            --expect rjw-skills.tar.gz \
            --expect rjw-skills.tar.gz.json \
            -- dist/*
